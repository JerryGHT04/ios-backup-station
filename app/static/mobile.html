<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ios-backup-station">
<title>ios-backup-station</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b6833' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='7' y='2.5' width='10' height='19' rx='2.5'/%3E%3Cpath d='M11 5.5h2'/%3E%3C/svg%3E">
<style>
/* Layout: Apple Diagnostics. Pure white page, two round buttons on top, a ring icon, a large left-aligned title with a grey
   description, then light-grey rounded action cards (icon, text, round button). Details open as bottom sheets. */
:root{
  --bg:#ffffff; --card:#f2f2f4; --text:#1c1c1e; --sub:#7b7b82; --line:#e4e4e8;
  --accent-a:#efeedc; --accent-b:#d8d7c2;      /* the pale yellow of the status strip */
  --accent:#a19d5a;                              /* ring and line icons */
  --accent-ink:#6b6833;                          /* text links and glyphs on the pale fill */
  --track:#e8e8ec; --ok:#2f9e44; --warn:#c98a00; --bad:#d1242f;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;
  padding-block:10px 56px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:430px;margin:0 auto}
@media (min-width:600px){.app,.sheet{max-width:560px}}   /* iPad: wider column, same layout */


/* top */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.cbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;color:var(--text)}
.cbtn:active{filter:brightness(.95)}
.cbtn svg{width:20px;height:20px}
.ringwrap{display:grid;place-items:center;margin:6px 0 22px}
.ring{width:104px;height:104px;position:relative}
.ring svg.rg{width:104px;height:104px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .tr{stroke:var(--accent);stroke-width:3;opacity:.9}
.ring.run .tr{stroke:var(--track);stroke-width:6;opacity:1}
.ring .fg{stroke:var(--accent);stroke-width:6;transition:stroke-dashoffset .35s ease}
.ring.done .tr{stroke:var(--ok);stroke-width:3;opacity:1}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center}
.ring .mid .dv svg{height:50px;width:auto;display:block;overflow:visible}
.ring.off .mid .dv{opacity:.35}
.ring .mid b{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .tick{width:40px;height:40px;stroke:var(--ok);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
h1.ttl{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.desc{margin:8px 0 0;font-size:21px;line-height:1.3;color:var(--sub);font-variant-numeric:tabular-nums}

/* action cards */
.cards{display:grid;gap:12px;margin-top:22px}
.acard{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:24px;padding:16px 16px 16px 18px;min-height:96px;cursor:pointer}
.acard:active{filter:brightness(.97)}
.acard .ai{width:34px;flex:none;display:grid;place-items:center;color:var(--accent-ink)}
.acard .ai svg{width:28px;height:28px;stroke-width:1.7}
.acard .at{flex:1;min-width:0}
.acard .at b{display:block;font-size:17px;font-weight:650;line-height:1.25}
.acard .at .ad{display:block;margin-top:2px;font-size:15px;color:var(--sub);line-height:1.35}
.acard .at .al{border:0;background:none;padding:2px 0 0;font-size:15px;color:var(--accent-ink);text-decoration:none}
.acard .go{width:40px;height:40px;border-radius:50%;border:0;flex:none;display:grid;place-items:center;background:linear-gradient(var(--accent-a),var(--accent-b));color:var(--accent-ink)}
.acard .go svg{width:18px;height:18px;stroke-width:2.2;fill:none}
.acard .go.fill svg{fill:currentColor;stroke:none}
.acard.main .at b{font-size:18px}
.acard.danger .ai,.acard.danger .at b{color:var(--bad)}
.acard.danger .go{background:#f7dfe1;color:var(--bad)}
.acard.dis{opacity:.5;pointer-events:none}
.storage{margin-top:18px;background:var(--card);border-radius:24px;padding:16px 18px}
.storage h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--sub)}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--track)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.legend s{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;text-decoration:none}
.sec-title{font-size:13px;font-weight:600;color:var(--sub);margin:24px 4px 8px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,20,15,.34);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:430px;max-height:90%;overflow:auto;background:#fff;border-radius:26px 26px 0 0;
  padding:8px max(18px,env(safe-area-inset-left,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:#d4d4d9;margin:2px auto 10px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.sh-h h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
.sh-h button{border:0;background:none;color:var(--accent-ink);font-size:16px;font-weight:600;padding:6px 2px}
.sheet p{margin:6px 0;color:var(--sub);font-size:15px}
.sheet p.t{color:var(--text)}
.field{display:block;width:100%;margin-top:10px;padding:13px 15px;border-radius:14px;border:0;background:var(--card);font:inherit;font-size:16px;color:var(--text)}
.err{color:var(--bad);font-size:13.5px;min-height:18px;margin-top:6px}
.link{border:0;background:none;color:var(--accent-ink);font-size:14px;padding:10px 0 0}
.cta{display:block;width:100%;margin-top:14px;padding:15px 16px;border-radius:16px;border:0;background:linear-gradient(var(--accent-a),var(--accent-b));color:var(--accent-ink);font-size:17px;font-weight:650}
.cta:active{filter:brightness(.96)}.cta:disabled{opacity:.6}
.cta.ghost{background:var(--card);color:var(--text);font-weight:500}
.card{background:var(--card);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 15px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .l{flex:1;min-width:0}.li .l b{display:block;font-weight:600;font-size:15.5px}.li .l span{color:var(--sub);font-size:13.5px}
.li .r{color:var(--sub);font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;margin-top:3px}
.tag.ok{background:#e1f2e5;color:var(--ok)}.tag.mute{background:var(--track);color:var(--sub)}.tag.bad{background:#fbe3e5;color:var(--bad)}
.steps .li{align-items:flex-start}
.n{width:26px;height:26px;border-radius:50%;background:var(--track);color:var(--sub);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;margin-top:1px}
.n.done{background:var(--ok);color:#fff}.n.cur{background:linear-gradient(var(--accent-a),var(--accent-b));color:var(--accent-ink)}
.mono{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px}
.sw b{font-weight:600}
.toggle{width:51px;height:31px;border-radius:16px;border:0;background:#d4d4d9;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);font-size:15px}
.days button[aria-pressed="true"]{background:linear-gradient(var(--accent-a),var(--accent-b));color:var(--accent-ink);font-weight:700}
.lab{font-size:13px;color:var(--sub);margin:16px 0 6px}
select.field{appearance:none}
details.faq{background:var(--card);border-radius:18px;margin-top:12px}
details.faq summary{cursor:pointer;padding:14px 15px;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);flex:none;margin:4px 4px 0 0;transition:transform .15s}
details.faq[open] summary::after{transform:rotate(-135deg)}
details.faq .fb{padding:0 15px 13px;font-size:14.5px;line-height:1.6}
details.faq .fb p{margin:7px 0;color:var(--text)}
pre.log{margin:0;padding:13px 15px;font-family:var(--mono);font-size:12px;line-height:1.6;overflow-x:auto;background:var(--card);border-radius:18px;max-height:50vh}
.dev-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.dev-row:first-child{border-top:0}
.dev-row .dv svg{height:34px;width:auto;display:block}
.dev-row .l{flex:1}.dev-row .l b{display:block;font-size:15.5px}.dev-row .l span{font-size:13px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:40;max-width:90%}

.lockbar{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.langmenu{position:absolute;top:50px;right:0;background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:6px;min-width:160px;z-index:60}
.langmenu button{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;border:0;background:none;padding:11px 12px;border-radius:9px;font-size:16px;text-align:left}
.langmenu button:active,.langmenu button:hover{background:var(--card)}
.langmenu svg{width:18px;height:18px;color:var(--accent-ink)}
.ring .mid .bg svg{width:44px;height:44px;color:var(--accent-ink);stroke-width:1.7}
.ring.off .mid .bg{opacity:.4}
/* lock screen */
.lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:50}
.lockbox{width:min(360px,100%)}
.lockbox .brand code{font-family:var(--mono);font-size:15px;background:var(--card);border-radius:7px;padding:3px 10px}
.lockbox .lead{margin:14px 0 4px;font-size:22px;font-weight:700;letter-spacing:-.015em}
.lockbox details.fg{margin-top:16px;font-size:13px;color:var(--sub)}
.lockbox details.fg summary{cursor:pointer;list-style:none}.lockbox details.fg summary::-webkit-details-marker{display:none}
.lockbox details.fg p{font-size:13px}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.ring .fg,.toggle,.toggle::after{transition:none}}
.sugg{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--card);border-radius:14px;font-size:13.5px;margin-top:10px}
</style>
</head>

<main class="app" id="app">
  <div class="hdr" id="hdr"></div>
  <section id="top" aria-live="polite"></section>
  <div class="cards" id="cards"></div>
  <div id="extra"></div>

      step(4,seen?'done':(d.wifiSync?'cur':''),seen?L('已通过无线找到手机','Found over Wi-Fi'):L('测试无线连接','Test the wireless connection'),seen?'':L('拔掉 USB 线，再点“检测连接”。','Unplug the USB cable, then tap Check Connection.'),[pr]);
      sh.appendChild(c);sh.appendChild(out);
      var qa=h('details','faq');qa.innerHTML='<summary></summary><div class="fb"></div>';$('summary',qa).textContent=L('为什么需要关闭“私有无线局域网地址”？','Why turn off “Private Wi-Fi Address”?');
      var fb=$('.fb',qa);[[L('它是什么：','What it is: '),L('打开后，手机在每个 Wi-Fi 里都使用随机生成的网卡地址，而不是出厂的真实地址，目的是防止热点跨网络追踪同一台手机。','When on, the device uses a randomly generated network address on each Wi-Fi instead of its real hardware address, so hotspots cannot track it across networks.')],
        [L('它不是让手机换 IP。','It does not change the IP. '),L('路由器根据 MAC 地址分配 IP，MAC 变了，IP 才可能跟着变。','The router assigns IPs by MAC address, so if the MAC changes the IP may change too.')],
        [L('为什么要关：','Why turn it off: '),L('iOS 26.4 起，打开它时手机在局域网里的连接容易出问题，表现就是 NAS 一会儿找得到、一会儿找不到。只需要对家里这个 Wi-Fi 关闭。','Since iOS 26.4, leaving it on can break local-network connections, so the NAS finds the device one moment and loses it the next. Turn it off only for your home Wi-Fi.')],
        [L('怎么关：','How: '),L('设置 → Wi-Fi → 点家里网络右边的 ⓘ → 关闭“私有无线局域网地址”。如果有 2.4G 和 5G 两个网络名，两个都要关。','Settings → Wi-Fi → tap ⓘ next to your home network → turn off Private Wi-Fi Address. If you have separate 2.4 GHz and 5 GHz names, do both.')]].forEach(function(x){var p=h('p');p.appendChild(h('b',null,x[0]));p.appendChild(document.createTextNode(x[1]));fb.appendChild(p)});
      sh.appendChild(qa);
    });
  }
  function openHealth(){
    sheet(L('环境自检','Setup check'),function(sh){
      sh.appendChild(h('p',null,L('下面这些会影响备份是否安全、能不能用。处理完后这里会自动消失。','These affect whether backups are safe and working. They disappear once fixed.')));
      var c=h('div','card');
      (S.health||[]).forEach(function(x){
        var li=h('div','li'),l=h('div','l');l.appendChild(h('b',null,L(x.title.zh,x.title.en)));l.appendChild(h('span',null,L(x.fix.zh,x.fix.en)));
        var tg=h('span','tag '+(x.level==='error'?'bad':'mute'),x.level==='error'?L('需要处理','Needs fixing'):L('建议处理','Recommended'));l.appendChild(h('br'));l.appendChild(tg);li.appendChild(l);c.appendChild(li)});
      sh.appendChild(c);
    });
  }
  function openLog(){
    sheet(L('运行日志','Logs'),function(sh){
      sh.appendChild(h('p',null,L('最近 200 行，每几秒自动刷新。','Last 200 lines, refreshed every few seconds.')));
      var p=h('pre','log','…');sh.appendChild(p);
      function load(){api('/api/log').then(function(j){var atEnd=p.scrollTop+p.clientHeight>=p.scrollHeight-8;p.textContent=j.lines.join('\n')||L('（还没有日志）','(no logs yet)');if(atEnd)p.scrollTop=p.scrollHeight}).catch(function(){})}
      load();sheetTimer=setInterval(load,3000);
    });
  }

  /* ---- 锁屏：设置密码要输两遍；右上角小图标切换语言 ---- */
  var lockSt='locked',lockInfo=null,lockMenu=false;
  function langBar(){
    var bar=$('#lockBar');bar.textContent='';
    var b=btn('cbtn',null,function(){lockMenu=!lockMenu;langBar()});b.setAttribute('aria-label',L('语言','Language'));b.setAttribute('aria-haspopup','menu');b.setAttribute('aria-expanded',String(lockMenu));b.appendChild(ico('globe'));bar.appendChild(b);
    if(lockMenu){
      var m=h('div','langmenu');m.setAttribute('role','menu');
      [['zh','简体中文'],['en','English']].forEach(function(x){
        var o=btn(null,x[1],function(){setLang(x[0]);lockMenu=false;lastSig='';showLock(lockSt,lockInfo)});o.setAttribute('role','menuitem');
        if(LANG===x[0])o.appendChild(ico('check'));m.appendChild(o)});
      bar.appendChild(m);
    }
  }
  function showLock(st,info){
    authed=false;clearTimeout(pollTimer);S=null;lastSig='';lockSt=st;lockInfo=info||null;
    var Lk=$('#lock'),box=$('#lockBox');box.textContent='';Lk.hidden=false;langBar();
    closeSheetQuiet();
    var first=st==='unset';
    var br=h('div','brand');br.appendChild(h('code',null,'ios-backup-station'));box.appendChild(br);
    box.appendChild(h('p','lead',first?L('设置访问密码','Set a password'):L('输入密码','Enter password')));
    function f(ph,type,ac){var i=h('input','field');i.type=type;i.placeholder=ph;i.autocomplete=ac;i.setAttribute('aria-label',ph);box.appendChild(i);return i}
    var p1=f(L('密码','Password'),'password',first?'new-password':'current-password'),p2=null,hint=null;
    if(first){p2=f(L('再输入一次','Confirm password'),'password','new-password');var tg=btn('link',L('添加提示词（可选）','Add a hint (optional)'));hint=f(L('输错两次后显示，不要直接写密码','Shown after two wrong attempts. Don’t write the password itself.'),'text','off');hint.maxLength=100;hint.hidden=true;tg.onclick=function(){hint.hidden=false;tg.hidden=true;hint.focus()};box.insertBefore(tg,hint)}
    var err=h('div','err');err.setAttribute('role','alert');box.appendChild(err);
    var hl=h('p','t');hl.hidden=true;box.appendChild(hl);
    function showHint(x){if(x){hl.textContent=L('提示：','Hint: ')+x;hl.hidden=false}}
    if(info&&info.hint)showHint(info.hint);
    var go2=btn('cta',first?L('设置密码','Set Password'):L('进入','Unlock'),submit);box.appendChild(go2);
    var fg=h('details','fg');fg.appendChild(h('summary',null,L('忘记密码？','Forgot password?')));fg.appendChild(h('p',null,L('在 NAS 上，把项目文件夹里的 config/auth.json 删除，再重启容器就能重新设置。','On the NAS, delete config/auth.json in the project folder and restart the container to set a new one.')));box.appendChild(fg);
    function submit(){
      err.textContent='';
      if(first){
        if(!p1.value){err.textContent=L('请输入密码。','Enter a password.');return}
        if(p1.value!==p2.value){err.textContent=L('两次输入的密码不一致。','The passwords don’t match.');return}
      }else if(!p1.value){err.textContent=L('请输入密码。','Enter your password.');p1.focus();return}
      go2.disabled=true;
      authPost(first?'/api/auth/setup':'/api/auth/login',first?{password:p1.value,hint:hint.value.trim()}:{password:p1.value}).then(function(j){
        go2.disabled=false;
        if(j.ok){enterApp();return}
        err.textContent=tr(j.error)||L('失败，请重试。','Failed, please try again.');showHint(j.hint);p1.select();
      }).catch(function(){go2.disabled=false;err.textContent=L('连接不上备份服务。','Cannot reach the backup service.')});
    }
    box.onkeydown=function(e){if(e.key==='Enter')submit()};
    p1.focus();
  }
  function closeSheetQuiet(){clearInterval(sheetTimer);$('#scrim').hidden=true}
  function enterApp(){authed=true;$('#lock').hidden=true;lockMenu=false;clearTimeout(pollTimer);lastSig='';poll()}
  fetch('/api/auth').then(function(r){return r.json()}).then(function(j){
    if(j.state==='ok')enterApp();else showLock(j.state,j);
  }).catch(function(){$('#top').appendChild(h('p','desc',L('连接不上备份服务。','Cannot reach the backup service.')))});
})();
</script>
